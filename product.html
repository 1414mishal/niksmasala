<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="docTitle">Product — Niks Masala</title>
<meta id="metaDesc" name="description" content="Authentic Mangalorean masala from Niks Masala, FSSAI-certified, traditionally handcrafted in Mangalore.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Niks Masala">
<meta id="ogTitle" property="og:title" content="Niks Masala">
<meta id="ogDesc" property="og:description" content="Authentic Mangalorean masala from Niks Masala.">
<meta id="ogImg" property="og:image" content="https://niksmasala.com/nobgnikslogo.webp">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/theme.css">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="scroll-progress" id="scrollProgress"></div>
<div id="siteHeader"></div>

<div class="breadcrumb"><div class="breadcrumb-inner container">
  <a href="index.html">Home</a><span class="breadcrumb-sep">›</span>
  <a href="shop.html">Shop</a><span class="breadcrumb-sep">›</span>
  <span id="crumbName">Product</span>
</div></div>

<div id="productContainer"></div>

<section class="block" style="background:var(--cream)">
  <div class="section-head">
    <div class="eyebrow">You may also like</div>
    <h2>Related Products</h2>
  </div>
  <div class="products-grid" id="relatedGrid"></div>
</section>

<div id="siteFooter"></div>

<script src="assets/app.js"></script>
<script src="assets/theme-app.js"></script>
<script>
mountHeaderFooter('shop');

const id = qs('id');
const p = getProducts().find(x => x.id===id);
let _views = [];

if(!p){
  document.getElementById('productContainer').innerHTML = `
    <div style="max-width:720px;margin:80px auto;text-align:center;padding:40px">
      <h2 style="font-size:32px;margin-bottom:16px">Product Not Found</h2>
      <p style="color:var(--muted);margin-bottom:24px">The product you're looking for doesn't exist or has been removed.</p>
      <a href="shop.html" class="btn btn-primary">← Back to Shop</a>
    </div>`;
} else {
  document.getElementById('docTitle').textContent = p.name+' — Niks Masala';
  document.getElementById('crumbName').textContent = p.name;

  /* Per-page meta tags */
  const shortDesc = (p.desc||'').slice(0,160);
  document.getElementById('metaDesc').setAttribute('content', shortDesc);
  document.getElementById('ogTitle').setAttribute('content', p.name+' — Niks Masala');
  document.getElementById('ogDesc').setAttribute('content', shortDesc);
  document.getElementById('ogImg').setAttribute('content', new URL(p.image||'nobgnikslogo.webp', location.href).href);

  /* Product JSON-LD — uses lowest variant price as `lowPrice` */
  const variants = p.variants || [{pack:p.weight||'',grams:p.grams||100,price:p.price}];
  _views = productGalleryViews(p);
  const lowP = Math.min(...variants.map(v=>v.price));
  const highP = Math.max(...variants.map(v=>v.price));
  const ld = {
    "@context":"https://schema.org",
    "@type":"Product",
    "name":p.name,
    "description":p.desc||'',
    "image":[new URL(p.image||'nobgnikslogo.webp',location.href).href],
    "brand":{"@type":"Brand","name":"Niks Masala"},
    "category":p.category,
    "offers":{
      "@type":"AggregateOffer",
      "priceCurrency":"INR",
      "lowPrice":lowP,
      "highPrice":highP,
      "offerCount":variants.length,
      "availability":(p.stock>0)?"https://schema.org/InStock":"https://schema.org/OutOfStock",
      "seller":{"@type":"Organization","name":"Iniha Exports Pvt Ltd"}
    }
  };
  const ldTag = document.createElement('script');
  ldTag.type='application/ld+json'; ldTag.textContent=JSON.stringify(ld);
  document.head.appendChild(ldTag);

  document.getElementById('productContainer').innerHTML = `
    <div class="product-single">
      <div class="product-gallery">
        <div class="main-img">
          <img id="mainImg" src="${attr(_views[0].src)}" alt="${attr(p.name)}" onerror="this.src='assets/products/garam-masala.webp'">
        </div>
        <div class="pack-switch">
          ${_views.map((v,i)=>`
            <button type="button" class="pack-view${i===0?' active-thumb':''}" onclick="pickView(${i})" aria-label="${attr(p.name)}${v.label?' — '+attr(v.label)+' pack':''}">
              <img src="${attr(v.src)}" alt="${attr(p.name)}${v.label?' '+attr(v.label)+' pack':''}" onerror="this.src='assets/products/garam-masala.webp'">
              ${v.label?`<span class="pack-view__label">${esc(v.label)}</span>`:''}
            </button>`).join('')}
        </div>
      </div>
      <div class="product-info">
        <div class="product-cat-tag" style="color:var(--red);margin-bottom:10px">${esc(p.category)}${p.badge?' · <span style="color:var(--gold);font-weight:700">'+esc(p.badge)+'</span>':''}</div>
        <h1>${esc(p.name)}</h1>

        <!-- Variant selector -->
        <div class="pv-label">Choose Size / Pack:</div>
        <div class="pv-pills" id="pvPills">
          ${variants.map((v,i)=>`
            <button class="pv-pill${i===0?' active':''}" onclick="pickVariant(${i})">
              <span class="pv-pack">${esc(v.pack)}</span>
              <span class="pv-price">${money(v.price)}</span>
            </button>`).join('')}
        </div>

        <div class="price-row" style="margin-top:14px">
          <span class="price" id="pvPrice">${money(variants[0].price)}</span>
          <small style="color:var(--muted);margin-left:8px">Inclusive of all taxes</small>
        </div>
        <p class="product-desc-short">${esc(p.long||p.desc)}</p>
        <div class="qty-row">
          <div class="qty-box">
            <button onclick="setQty(-1)" aria-label="Decrease quantity">−</button>
            <input type="number" id="qty" value="1" min="1" max="${attr(p.stock||99)}" aria-label="Quantity">
            <button onclick="setQty(1)" aria-label="Increase quantity">+</button>
          </div>
          <button class="btn btn-primary" style="flex:1" onclick="addAndGo()">ADD TO CART</button>
          <button class="btn btn-dark" style="flex:1" onclick="buyNow()">BUY NOW</button>
        </div>
        <div class="trust-badges">
          <span class="trust-badge">🌿 100% Pure &amp; Natural</span>
          <span class="trust-badge">✓ FSSAI Certified</span>
          <span class="trust-badge">🚚 Free Shipping ₹799+</span>
          <span class="trust-badge">🏦 Net Banking</span>
        </div>
        <div class="product-meta">
          <div><strong>Pack:</strong> <span id="pvPackMeta">${esc(variants[0].pack)}</span></div>
          <div><strong>Availability:</strong> <span style="color:${p.stock>0?'var(--ok)':'var(--red)'}">${p.stock>0?'✓ In Stock':'Out of Stock'}</span></div>
          <div><strong>Category:</strong> <span><a href="shop.html?cat=${attr(encodeURIComponent(p.category))}" style="color:var(--red)">${esc(p.category)}</a></span></div>
          <div><strong>Shipping:</strong> <span>Free above ${money(getSettings().shippingFree)}</span></div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="tabs">
        <div class="tab-heads">
          <button class="tab-head active" onclick="showTab(0)">Description</button>
          <button class="tab-head" onclick="showTab(1)">How to Use</button>
          <button class="tab-head" onclick="showTab(2)">Reviews</button>
          <button class="tab-head" onclick="showTab(3)">Shipping &amp; Returns</button>
        </div>
        <div class="tab-body" id="tab0">
          <h3 style="font-size:20px;margin-bottom:12px">About this product</h3>
          <p style="margin-bottom:14px">${esc(p.long||p.desc)}</p>
          <p>At Niks Masala, every spice is sourced from trusted farms, roasted in small batches, and stone-ground to preserve every ounce of flavor and aroma. No artificial colors, no preservatives — just pure, honest spice.</p>
          <ul style="margin-top:14px;padding-left:22px;color:var(--text)">
            <li>100% Pure &amp; Natural — no additives</li>
            <li>Small-batch crafted for freshness</li>
            <li>Stone-ground to preserve essential oils</li>
            <li>Sourced ethically from Indian farms</li>
            <li>Sealed packaging for long-lasting aroma</li>
          </ul>
        </div>
        <div class="tab-body hidden" id="tab1">
          <h3 style="font-size:20px;margin-bottom:12px">How to use</h3>
          <p>Add ground spice to hot oil or ghee at the start of cooking to release aroma, or sprinkle as a finishing touch. Typical usage: 1 teaspoon per dish (serves 2–3).</p>
          <p style="margin-top:14px"><strong>Storage:</strong> Keep in an airtight container in a cool, dry place. Use within 12 months of opening for best flavor.</p>
        </div>
        <div class="tab-body hidden" id="tab2">
          <h3 style="font-size:20px;margin-bottom:20px">Customer Reviews</h3>
          <!-- Reviews intentionally empty until verified-buyer reviews are
               collected. Per Consumer Protection (E-Commerce) Rules 2020,
               sellers may not publish fabricated or paid reviews. Wire this
               section to a verified-purchase review system before go-live. -->
          <div style="padding:32px 20px;text-align:center;border:1px dashed var(--line);border-radius:10px;background:var(--cream)">
            <div style="font-size:36px;margin-bottom:8px">📝</div>
            <strong style="font-size:16px;display:block;margin-bottom:6px">No reviews yet</strong>
            <p style="color:var(--muted);font-size:14px;margin-bottom:14px">Be the first to share your experience after you receive your order.</p>
            <a href="contact.html?subject=Review" class="btn btn-primary btn-sm">Send us your review</a>
          </div>
        </div>
        <div class="tab-body hidden" id="tab3">
          <h3 style="font-size:20px;margin-bottom:12px">Shipping &amp; Returns</h3>
          <p><strong>Shipping:</strong> Free shipping on orders above ₹799. Below that, rates vary by zone — from ₹60 (Mangalore local) to ₹105 (North/East India). Standard delivery in 3–7 business days across India.</p>
          <p style="margin-top:10px"><strong>Returns:</strong> See our <a href="returns.html" style="color:var(--red);font-weight:600">Returns &amp; Refunds policy</a>.</p>
        </div>
      </div>
    </div>`;

  // Related
  const related = getProducts().filter(x=>x.category===p.category && x.id!==p.id).slice(0,4);
  const rel = related.length ? related : getProducts().filter(x=>x.id!==p.id).slice(0,4);
  document.getElementById('relatedGrid').innerHTML = rel.map(productCardHTML).join('');
}

function setQty(d){const q=document.getElementById('qty');q.value=Math.max(1,+q.value+d)}
function pickView(i){
  const v=_views[i]; if(!v) return;
  const m=document.getElementById('mainImg'); if(m) m.src=v.src;
  document.querySelectorAll('.pack-view').forEach((el,x)=>el.classList.toggle('active-thumb',x===i));
}
function pickVariant(i){
  _selectedVariant[id]=i;
  const variants=(p&&p.variants)||[];
  const v=variants[i]; if(!v) return;
  document.getElementById('pvPrice').textContent=money(v.price);
  document.getElementById('pvPackMeta').textContent=v.pack;
  document.querySelectorAll('.pv-pill').forEach((el,x)=>el.classList.toggle('active',x===i));
}
function addAndGo(){addToCart(id,+document.getElementById('qty').value)}
function buyNow(){
  /* addToCart is synchronous (it writes to localStorage); navigate immediately.
     The previous 600ms setTimeout was a guess and occasionally raced. */
  addToCart(id,+document.getElementById('qty').value);
  closeCartDrawer && closeCartDrawer();
  location.href='checkout.html';
}
function showTab(i){
  document.querySelectorAll('.tab-head').forEach((t,x)=>t.classList.toggle('active',x===i));
  document.querySelectorAll('.tab-body').forEach((t,x)=>t.classList.toggle('hidden',x!==i));
}
</script>
<script src="assets/theme-anim.js"></script>
</body>
</html>
